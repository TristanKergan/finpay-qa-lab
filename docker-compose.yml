version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finpay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finpay_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finpay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finpay_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/finpay_db
      - JWT_SECRET_KEY=finpay-qa-super-secret-key-production-change-in-real-fintech-999
      - JWT_ALGORITHM=HS256
      - BUG_MODE=false
      - WEBHOOK_SECRET=payment-provider-hmac-secret-finpay-2026
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:80"]
    command: >
      sh -c "alembic -c backend/alembic.ini upgrade head &&
             python backend/scripts/seed_data.py &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: finpay_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
