[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -v -s --alluredir=allure-results
markers =
    api: API automated tests
    ui: Playwright UI automated tests
    database: Direct database consistency & constraint tests
    integration: End-to-end integration workflows
    security: Security and IDOR tests
    bug_mode: Tests verifying bug reproduction under BUG_MODE
