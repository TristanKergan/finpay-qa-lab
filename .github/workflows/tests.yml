name: FinPay QA Lab CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Linters
        run: |
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check backend tests

      - name: Lint Frontend TypeScript
        run: |
          cd frontend
          npm ci
          npm run build

  api-and-database:
    name: API & Database Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finpay_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r tests/requirements.txt

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finpay_db
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Seed Database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finpay_db
        run: |
          python backend/scripts/seed_data.py

      - name: Run Database Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finpay_db
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finpay_db
        run: |
          PYTHONPATH=. pytest tests/database -v --alluredir=allure-results

      - name: Run API Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finpay_db
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finpay_db
        run: |
          PYTHONPATH=. pytest tests/api -v --alluredir=allure-results

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-results
          path: allure-results/
          retention-days: 7

  integration-and-security:
    name: Integration & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r tests/requirements.txt

      - name: Seed Database
        run: |
          python backend/scripts/seed_data.py

      - name: Run Integration Tests
        run: |
          PYTHONPATH=. pytest tests/integration -v --alluredir=allure-results

      - name: Run Security Tests
        run: |
          PYTHONPATH=. pytest tests/security -v --alluredir=allure-results

      - name: Upload Allure Integration Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-integration-results
          path: allure-results/
          retention-days: 7

  ui-playwright:
    name: Playwright UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r tests/requirements.txt
          playwright install --with-deps chromium

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Seed Database
        run: |
          python backend/scripts/seed_data.py

      - name: Run Playwright Headless UI Tests
        run: |
          PYTHONPATH=. pytest tests/ui -v --alluredir=allure-results

      - name: Upload UI Artifacts (Screenshots & Traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-artifacts
          path: |
            allure-results/
            test-results/
          retention-days: 7

  allure-report:
    name: Generate Allure Report
    needs: [api-and-database, integration-and-security, ui-playwright]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download API Results
        uses: actions/download-artifact@v4
        with:
          name: allure-api-results
          path: combined-allure-results

      - name: Download Integration Results
        uses: actions/download-artifact@v4
        with:
          name: allure-integration-results
          path: combined-allure-results

      - name: Generate Allure HTML Report
        run: |
          npx allure generate combined-allure-results -o allure-report --clean

      - name: Upload Complete Allure Report HTML
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: allure-report/
          retention-days: 14
